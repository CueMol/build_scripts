name: 'Build deplibs posix'
description: 'Build deplibs posix'

inputs:
  basedir:
     description: 'base dir'
     required: true
  name-suffix:
     description: >-
       Appended to the OS part of the tarball name, for a build that shares the
       runner OS/arch with another one (e.g. "-manylinux" in a container)
     required: false
     default: ''
  with-glew:
     description: 'Build GLEW (only the OpenGL GUI builds use it)'
     required: false
     default: 'true'

outputs:
  artifact-path:
    description: 'built file'
    value: ${{ steps.create-artifact.outputs.artifact-path }}

runs:
  using: "composite"
  steps:

  - name: Install boost
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_boost.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install TBB
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_tbb.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install Embree
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_embree.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install OIDN
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_oidn.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install CGAL
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_cgal.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install glew
    if: inputs.with-glew == 'true'
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_glew.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install lcms2
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_lcms2.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Install fftw3
    shell: bash
    run: |
      cd ${GITHUB_WORKSPACE}
      BASEDIR=${{ inputs.basedir }}
      bash build_deplibs_posix/build_fftw3.sh $BASEDIR ${{ runner.os }} ${{ runner.arch }}

  - name: Create deplibs tarball
    id: create-artifact
    shell: bash
    env:
      ARTIFACT_NAME: deplibs_${{ runner.os }}${{ inputs.name-suffix }}_${{ runner.arch }}.tar.bz2
    run: |
      set -eux
      BASEDIR=${{ inputs.basedir }}
      # Clean-up
      rm -rf $BASEDIR/tmp
      # Bundle the version manifest so consumers can read it from the tarball
      cp "${GITHUB_WORKSPACE}/deplibs.env" "$BASEDIR/"
      cd $BASEDIR/..
      tar cjf ${GITHUB_WORKSPACE}/${ARTIFACT_NAME} target
      cd ${GITHUB_WORKSPACE}
      ls -lh ${GITHUB_WORKSPACE}/${ARTIFACT_NAME}
      echo "artifact-path=${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
